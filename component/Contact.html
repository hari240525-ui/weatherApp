<section class="hero">

    <h1>Get in Touch</h1>

    <p>
        We'd love to hear your ideas, suggestions, or feedback. Your information
        is kept private and is never shared with third parties.
    </p>

</section>


<section class="contact-container">

    <div class="contact-card">

        <h2>Send us a Message</h2>

        <form>

            <input type="text" placeholder="Your Name">

            <input type="email" placeholder="Your Email">

            <textarea rows="6" placeholder="Your Message"></textarea>

            <button type="submit">
                <i class="fa-solid fa-paper-plane"></i>
                Send Message
            </button>

        </form>

    </div>


    <div class="contact-card">

        <h2>Connect with Us</h2>

        <div class="social-links">

            <a href="https://drive.google.com/file/d/1rsogbAW7tIqrgtYeFsmbRrViCcOf_yDC/view?usp=drive_link"
               target="_blank">

                <i class="fa-brands fa-telegram"></i>

                Telegram

            </a>

            <a href="#" class="disabled">

                <i class="fa-brands fa-whatsapp"></i>

                WhatsApp (Coming Soon)

            </a>

            <a href="#" class="disabled">

                <i class="fa-brands fa-discord"></i>

                Discord (Coming Soon)

            </a>

        </div>

    </div>

</section>

</body>
